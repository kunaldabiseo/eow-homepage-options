<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Expert Ophthalmology Witness | Homepage options</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1A1A1A;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.sw{position:fixed;left:16px;bottom:16px;z-index:10;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:#1A1A1A;box-shadow:0 12px 30px -8px rgba(0,0,0,.6);border:2px solid #FFEA00}
.sw span{color:#FFEA00;font-size:12px;font-weight:600;padding:0 8px 0 10px}
.sw button{border:0;cursor:pointer;font:600 14px/1 system-ui,sans-serif;padding:10px 16px;border-radius:999px;background:transparent;color:#fff}
.sw button[aria-pressed=true]{background:#FFEA00;color:#1A1A1A}
.sw button:hover:not([aria-pressed=true]){background:rgba(255,255,255,.12)}
@media (max-width:1080px){.sw{bottom:calc(100px + env(safe-area-inset-bottom));left:10px}.sw span{display:none}}
</style></head><body>
<iframe id="f" title="Homepage design"></iframe>
<div class="sw" role="group" aria-label="Switch design">
  <span>Design</span>
  <button type="button" data-v="1">Option 1</button>
  <button type="button" data-v="2">Option 2</button>
</div>
<script>
var f=document.getElementById("f"),b=[].slice.call(document.querySelectorAll(".sw button"));
function go(v){v=v==="2"?"2":"1";f.src="index-"+v+".html";b.forEach(function(x){x.setAttribute("aria-pressed",x.dataset.v===v)});history.replaceState(null,"","#option-"+v);}
b.forEach(function(x){x.onclick=function(){go(x.dataset.v)}});
go(/2/.test(location.hash)?"2":"1");
</script>
</body></html>
